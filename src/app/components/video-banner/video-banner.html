<div class="dual-video-banner">
  <section class="video-banner" (click)="redirectToOffers()">
    <video autoplay muted loop class="video-background">
      <source src="assets/Pepsi.mp4" type="video/mp4">
      <img src="assets/images/fallback-1.jpg" alt="Offers Promo">
    </video>
  </section>

  <section class="video-banner" (click)="redirectToProducts()">
    <video autoplay muted loop class="video-background">
      <source src="assets/Cola.mp4" type="video/mp4">
      <img src="assets/images/fallback-2.jpg" alt="Products Promo">
    </video>
  </section>
</div>
