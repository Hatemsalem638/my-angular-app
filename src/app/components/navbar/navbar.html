<nav class="navbar">
  <div class="navbar-left">
    <img src="assets/logo.jpg" alt="App Logo" class="logo">

    <button class="hamburger" (click)="toggleMenu()" aria-label="Toggle menu" [attr.aria-expanded]="isMenuOpen">
      ☰
    </button>
  </div>

  <div class="menu-content" [class.open]="isMenuOpen">
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/products" routerLinkActive="active">Products</a>
      <a routerLink="/offers" routerLinkActive="active">Offers</a>
    </div>

    <div class="navbar-right">
      <div class="search-container">
        <input type="text" placeholder="Search..." #searchInput>
        <button (click)="search(searchInput.value)">Search</button>
      </div>
      <div class="nav-actions">
        <a href="#" class="language-selector">EN</a>
        <a routerLink="/cart" class="cart-icon">🛒</a>

        <button class="order-btn" (click)="navigateToProducts()">Order Now</button>

        
        <ng-container *ngIf="currentUser; else loginTemplate">
          <span class="username">{{ currentUser.username }}</span>
          <button class="logout-btn" (click)="logout()">Logout</button>
        </ng-container>
        
        <ng-template #loginTemplate>
          <button class="login-btn" (click)="openLogin()">Login</button>
        </ng-template>
        
        <app-login #loginModal></app-login>
      </div>
    </div>
  </div>
</nav>
